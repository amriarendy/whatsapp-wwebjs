<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Whatsapp API</title>
    <!-- getbootsrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <style>
        .client {
            border: 1px solid #ccc;
            padding: 20px;
            box-sizing: border-box;
            display: inline-block;
            margin: 10px;
        }
        .hide {
            display: none;
        }
    </style>
</head>
  <body>
    <div class="container py-3">
        <header>
            <div class="d-flex flex-column flex-md-row align-items-center pb-4 mb-5 border-bottom">
    
            <div class="header fixed-top" id="header">
                <nav class="navbar navbar-expand-lg bg-light">
                    <div class="container-sm">
                            <a class="navbar-brand" href="https://github.com/amriarendy">
                            <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="logo" rel="icon" width="30px">
                        </a>
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                            </button>
                            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                                <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="#">Tentang</a>
                                </li>
                                <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                    Kategori
                                </a>
                                <ul class="dropdown-menu">
                                    <li><a class="dropdown-item" href="#">Native</a></li>
                                    <li><a class="dropdown-item" href="#">Laravel</a></li>
                                    <li><a class="dropdown-item" href="#">Codeigniter 3</a></li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li><a class="dropdown-item" href="#">Tambah Master</a></li>
                                </ul>
                                </li>
                            </ul>
                            <a href="#" class="btn btn-outline-success mr-3">Login</a>
                            </div>
                        </div>
                    </nav>
                </div>
            </div>
        </header>
    </div>
    <!-- start content -->
    <div class="container" id="app">
        <h1>WHATSAPP API (Multiple Device)</h1>
        <div class="form-container">
            <div class="mb-3">
                <label for="client-id">ID:</label>
                <input class="form-control" type="text" id="client-id" placeholder="Masukan ID"/>
            </div>
            <div class="mb-3">
                <label for="client-description">Deskripsi:</label>
                <textarea class="form-control" type="text" id="client-description" placeholder="Masukan Deskripsi"></textarea>
            </div>
            <button class="btn btn-primary add-client-btn">Tambah Client</button>
        </div>
        <hr>
        <div class="client-container">
            <div class="client hide">
                <h3 class="title"></h3>
                <p class="description"></p>
                <img id="qrcode" src="" alt="QR Code" title="QR Code">
                <h3>Logs:</h3>
                <ul class="logs"></ul>
            </div>
        </div>
    </div>
    <!-- end content -->

    <!-- jquery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.1/jquery.min.js" integrity="sha512-aVKKRRi/Q/YV+4mjoKBsE4x3H+BkegoM/em46NNlCqNTmUYADjBbeNefNxYV7giUp0VxICtqdrbqU7iVaeZNXA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- getbootsrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <!-- socket.io css -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js" integrity="sha512-YeeA/Qxn5hYdkukScTCNNOhTrv1C2RubAGButJ1rmgQwZf/HdRaCGl+JAVkqsqaNRaYNHdheiuKKuPf9mDcqKg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        $(document).ready(function () {
            let port = 3000;
            var socket = io();

            $('.add-client-btn').click(function() {
                var clientId = $('#client-id').val();
                var clientDescription = $('#client-description').val();

                var template = $('.client').first().clone().removeClass('hide').addClass(clientId);
                template.find('.title').html(clientId);
                template.find('.description').html(clientDescription);
                $('.client-container').append(template);

                socket.emit('create-session', {
                    id: clientId,
                    description: clientDescription
                });
            });

            socket.on('init', function(data) {
                $('.client-container .client').not(':first').remove();
                console.log(data);
                for (var i = 0; i < data.length; i++) {
                    var session = data[i];

                    var clientId = session.id;
                    var clientDescription = session.description;

                    var clientClass = 'client-' + clientId;
                    var template = $('.client').first().clone().removeClass('hide').addClass(clientClass);

                    template.find('.title').html(clientId);
                    template.find('.description').html(clientDescription);
                    $('.client-container').append(template);
                    
                    if (session.ready) {
                        $(`.client.${clientClass} .logs`).prepend($('<li>').text('Whatsapp is ready!'));
                    } else {
                        $(`.client.${clientClass} .logs`).prepend($('<li>').text('Connecting..'));
                    }
                    
                }
            });

            socket.on('remove-session', function(id) {
                $(`.client.client-${data.id}`).remove();
            });

            socket.on('message', function(data) {
                // console.log(msg);
                $(`.client.${data.id}.logs`).append($('<li>').text(data.text));
            });

            socket.on('qr', function(data) {
                $(`.client.${data.id} #qrcode`).attr('src', data.src);
                $(`.client.${data.id} #qrcode`).show();
            });
            
			socket.on('ready', function(data) {
				$(`.client.${data.id} #qrcode`).hide();
			});

			socket.on('authenticated', function(data) {
				$(`.client.${data.id} #qrcode`).hide();
			});
        });
    </script>
  </body>
</html>
